[project]
name = "path-iterator-pager-lib"
version = "0.1.0"
description = "Iterate over the entries of a directory in fixed-size pages so that a listing with millions of files does not have to fit in memory all at once."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
